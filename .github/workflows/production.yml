name: Deploy CMS (production)

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-cms
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_APP_API_URL: ${{ vars.PUBLIC_API_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Validate build configuration
        run: test -n "$VITE_APP_API_URL"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CMS
        run: pnpm build

      - name: Package static files
        run: tar -C dist -czf "iclinic-cms-${GITHUB_SHA}.tar.gz" .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Upload static release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -P "$VPS_PORT" \
            "iclinic-cms-${GITHUB_SHA}.tar.gz" \
            "$VPS_USER@$VPS_HOST:/tmp/iclinic-cms-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'DEPLOY'
          set -euo pipefail

          release_sha="$1"
          deploy_root="/var/www/iclinic-cms"
          archive="/tmp/iclinic-cms-${release_sha}.tar.gz"
          release_dir="${deploy_root}/releases/${release_sha}"

          umask 022
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          test -f "${release_dir}/index.html"

          ln -sfn "$release_dir" "${deploy_root}/current.next"
          mv -Tf "${deploy_root}/current.next" "${deploy_root}/current"
          rm -f "$archive"
          DEPLOY

      - name: Verify deployment
        env:
          CMS_URL: ${{ vars.CMS_URL }}
        run: |
          test -n "$CMS_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$CMS_URL" > /dev/null
